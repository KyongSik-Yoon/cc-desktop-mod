# desk-look 버전을 올린 커밋이 main 에 들어오면 그 버전의 태그와 릴리즈를 만든다.
# 노트는 같은 커밋(또는 그 뒤)에 넣은 .github/release-notes/vX.Y.Z.md 를 쓴다.
# 이미 있는 태그는 건드리지 않으므로 몇 번을 돌아도 버전 하나에 릴리즈 하나다.
name: release

on:
  push:
    branches: [main]
    paths:
      - desk-look/.claude-plugin/plugin.json
      - .github/release-notes/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(jq -r .version desk-look/.claude-plugin/plugin.json)
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to do"
            exit 0
          fi
          notes=".github/release-notes/$tag.md"
          if [ ! -s "$notes" ]; then
            echo "::error::$notes is missing; add the release notes for $tag"
            exit 1
          fi
          # 태그는 머지 커밋이 아니라 그 버전으로 올린 커밋에 단다.
          commit=$(git log -1 --format=%H -G"\"version\": \"$version\"" -- desk-look/.claude-plugin/plugin.json)
          git tag "$tag" "$commit"
          git push origin "$tag"
          gh release create "$tag" --verify-tag --title "desk-look $version" --notes-file "$notes" --latest
